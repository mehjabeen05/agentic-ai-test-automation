[pytest]
testpaths = tests
python_files = test_*.py
python_classes = TestSuite*
python_functions = test_*

# tests/generated/ holds AI-generated Playwright tests (Step 6+). They are
# executed deliberately by the Execution Agent (a later step), never by a
# plain `pytest` run — generated code must not run just because it exists.
# An explicit path (e.g. `pytest tests/generated/test_x.py`) still works;
# this only prunes it from automatic recursive discovery.
norecursedirs = .git .venv .pytest_cache generated

addopts = -v --browser chromium --screenshot only-on-failure --output screenshots

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    e2e: end-to-end browser test
